      - "donderdag"
      - "vrijdag"
      - "zaterdag"
      - "zondag"
  zendure_ems_profiel:
    name: "Zendure EMS profiel activeren"
    icon: mdi:tune-variant
    options:
      - "Kies een profiel"
      - "Nul op de meter"
      - "Dynamisch NOM"
