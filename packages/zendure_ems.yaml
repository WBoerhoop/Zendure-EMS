      - "Prijsgestuurd"
      - "Laden (vol vermogen)"
      - "Ontladen (vol vermogen)"
  zendure_ems_kalibratie:
    name: "Zendure EMS kalibratie (volladen naar 100 %)"
    icon: mdi:battery-sync
    options:
      - "Uit"
      - "Wekelijks"
      - "Elke 2 weken"
      - "Elke 3 weken"
      - "Op datum"
      - "Alleen na max. aantal dagen"
  zendure_ems_kalibratie_dag:
