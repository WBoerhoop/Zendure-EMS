      - entity: sensor.zendure_set2_relais_ontladen_vandaag
        name: Ontladen
        statistics:
          period: day
          type: max
          align: middle
        type: column
        color: '#01a180'
        show:
          in_header: false
          extremas: false
    - type: custom:apexcharts-card
      stacked: true
      header:
        show: true
        title: Kalibraties (hoogste SOC per dag)
      graph_span: 2month
      span:
