- title: Statistieken
  path: statistieken
  icon: mdi:chart-box-outline
  type: sections
  max_columns: 2
  sections:
  - cards:
    - type: tile
      entity: input_boolean.zendure_ems_toon_s_dagplanning
      name: Dagplanning
      icon: mdi:calendar-clock
      hide_state: true
      tap_action:
        action: toggle
      icon_tap_action:
        action: toggle
      grid_options:
        columns: full
    - content: |-
        {%- set up = state_attr('sensor.zendure_ems_planning','komende') or [] -%}
        {%- set pa = 'sensor.zendure_ems_prijsactie' -%}
        {%- if up | count == 0 -%}
        Nog geen plan: er is geen prijsdata. Controleer de prijssensor bij **Instellingen**.
        {%- else -%}
        {%- set vandaag = now().strftime('%d') -%}
        {%- set ns = namespace(b=[]) -%}
        {%- for q in up -%}
        {%- if q.c > 0.01 -%}{%- set a = '🔌 Laden van het net' -%}{%- set k = q.c -%}
        {%- elif q.h -%}{%- set a = '⏸ Accu vasthouden' -%}{%- set k = 0 -%}
        {%- elif q.d > 0.02 -%}{%- set a = '🔋 Accu levert aan huis' -%}{%- set k = q.d -%}
        {%- elif q.z > q.v + 0.01 -%}{%- set a = '☀️ Zonoverschot' -%}{%- set k = q.z - q.v -%}
        {%- elif q.u > 0.02 -%}{%- set a = '🏠 Huis van het net' -%}{%- set k = q.u -%}
        {%- elif q.z > 0.01 and q.z >= q.v - 0.02 -%}{%- set a = '☀️ Zon dekt verbruik' -%}{%- set k = q.v -%}
        {%- else -%}{%- set a = '— Rust' -%}{%- set k = 0 -%}{%- endif -%}
        {%- set last = ns.b[-1] if ns.b | count > 0 else none -%}
        {%- if last is not none and last.a == a -%}
        {%- set ns.b = ns.b[:-1] + [dict(last, e=q.s + 900, k=last.k + k, p=last.p + q.p, n=last.n + 1, soc=q.soc)] -%}
        {%- else -%}
        {%- set ns.b = ns.b + [dict(a=a, s=q.s, e=q.s + 900, k=k, p=q.p, n=1, soc=q.soc)] -%}
        {%- endif -%}
        {%- endfor -%}
        {%- set hs = namespace(u=[]) -%}
        {%- for q in up -%}
        {%- set h = (q.s // 3600) * 3600 -%}
        {%- if h not in hs.u | map(attribute='h') | list -%}
        {%- set g = up | selectattr('s','ge',h) | selectattr('s','lt',h+3600) | map(attribute='p') | list -%}
        {%- set hs.u = hs.u + [dict(h=h, p=(g | sum) / (g | count))] -%}
        {%- endif -%}
        {%- endfor -%}
        {%- set goedkoop = hs.u | sort(attribute='p') | first -%}
        {%- set duur = hs.u | sort(attribute='p') | last -%}
        {%- set laag = up | sort(attribute='soc') | first -%}
        {%- macro tijd(t) -%}{{ '' if (t | timestamp_custom('%d')) == vandaag else 'morgen ' }}{{ t | timestamp_custom('%H:%M') }}{%- endmacro -%}
        {%- set laden = ns.b | selectattr('a','eq','🔌 Laden van het net') | list -%}
        ### {{ '🔌 ' ~ (laden | count) ~ ' laadmoment(en) van het net' if laden | count > 0 else '✅ Geen netladen gepland' }}
        {% for b in laden -%}
        - **{{ tijd(b.s) }}–{{ (b.e) | timestamp_custom('%H:%M') }}** · {{ '%.1f' | format(b.k) }} kWh · gem. € {{ '%.3f' | format(b.p / b.n) }} · SOC naar {{ b.soc }}%
        {% endfor %}
        **Goedkoopste uur:** {{ tijd(goedkoop.h) }} (€ {{ '%.3f' | format(goedkoop.p) }}) · **duurste uur:** {{ tijd(duur.h) }} (€ {{ '%.3f' | format(duur.p) }})
        **Laagste SOC verwacht:** {{ laag.soc }}% om {{ tijd(laag.s) }}
        **Plan tot {{ tijd(up[-1].s + 900) }}:** verbruik {{ state_attr(pa,'verwacht_verbruik_kwh') }} kWh · zon {{ state_attr(pa,'verwachte_zon_kwh') }} kWh · netladen {{ state_attr(pa,'gepland_netladen_kwh') }} kWh · tekort {{ state_attr(pa,'verwacht_tekort_kwh') }} kWh

        | Wanneer | Wat | kWh | Gem. prijs | SOC eind |
        |:--|:--|--:|--:|--:|
        {% for b in ns.b if b.n >= 2 or b.a != '— Rust' -%}
        | {{ tijd(b.s) }}–{{ b.e | timestamp_custom('%H:%M') }} | {{ b.a }} | {{ '%.1f' | format(b.k) if b.k > 0.05 else '' }} | € {{ '%.3f' | format(b.p / b.n) }} | {{ b.soc }}% |
        {% endfor -%}
        {%- if states('input_select.zendure_ems_modus') != 'Prijsgestuurd' %}
        <sub>⚠️ Modus is nu **{{ states('input_select.zendure_ems_modus') }}**: het plan wordt berekend, maar alleen uitgevoerd in **Prijsgestuurd**{{ ' met Slim laden aan' if is_state('input_boolean.zendure_ems_slim_laden','off') else '' }}.</sub>
        {%- endif -%}
        {%- endif -%}
      grid_options:
        columns: full
      type: markdown
      visibility:
      - condition: state
        entity: input_boolean.zendure_ems_toon_s_dagplanning
        state: 'on'
    - entities:
      - entity: sensor.zendure_ems_opgeslagen_energie
        name: Nu opgeslagen
      - attribute: kwh_bruikbaar
        entity: sensor.zendure_ems_prijsactie
