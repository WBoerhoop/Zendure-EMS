    - apex_config:
        chart:
          height: 280
        legend:
          show: true
      graph_span: 24h
      grid_options:
        columns: full
      header:
        show: true
        show_states: false
        title: Verbruiksprofiel (hier rekent de planner mee)
      now:
        label: Nu
        show: true
      series:
      - color: '#8e44ad'
        curve: stepline
        data_generator: const d = new Date(); d.setHours(0,0,0,0); return (entity.attributes.werkdag || []).map((v, i) => [d.getTime() + i * 900000, v]);
        entity: sensor.zendure_ems_verbruiksprofiel
        name: Werkdag (geleerd)
        stroke_width: 2
        type: line
        yaxis_id: w
      - color: '#e84393'
        curve: stepline
        data_generator: const d = new Date(); d.setHours(0,0,0,0); return (entity.attributes.weekend || []).map((v, i) => [d.getTime() + i * 900000, v]);
        entity: sensor.zendure_ems_verbruiksprofiel
        name: Weekend (geleerd)
        stroke_width: 2
        type: line
        yaxis_id: w
      - color: '#95a5a6'
        entity: sensor.zendure_ems_huisverbruik_kwartiergemiddelde
        group_by:
          duration: 15min
          func: avg
        name: Vandaag gemeten
        opacity: 0.5
        type: column
        yaxis_id: w
      span:
        start: day
      type: custom:apexcharts-card
      yaxis:
      - apex_config:
          title:
            text: W (kwartiergemiddelde)
        decimals: 0
        id: w
        min: 0
      visibility:
      - condition: state
        entity: input_boolean.zendure_ems_toon_s_geleerd
        state: 'on'
    - content: |-
        {%- set v = 'sensor.zendure_ems_verbruiksprofiel' -%}
        {%- set mw = state_attr(v,'metingen_werkdag') or [] -%}
        {%- set mwe = state_attr(v,'metingen_weekend') or [] -%}
        {%- set gw = mw | select('gt',0) | list | count -%}
        {%- set gwe = mwe | select('gt',0) | list | count -%}
        {%- set wk = now().weekday() >= 5 -%}
        {%- set prof = (state_attr(v,'weekend') if wk else state_attr(v,'werkdag')) or [] -%}
        {%- macro balk(n) -%}{%- set f = (n * 10 / 96) | round(0) | int -%}{{ '▇' * f }}{{ '░' * (10 - f) }}{%- endmacro -%}
        {%- macro kw(i) -%}{{ '%02d:%02d' | format(i // 4, (i % 4) * 15) }}{%- endmacro -%}
        Vandaag rekent de planner met het **{{ 'weekend' if wk else 'werkdag' }}profiel**{% if prof | count == 96 %}: nu {{ prof[(now().hour * 4 + now().minute // 15)] }} W verwacht{% endif %}.

        | | Werkdag | Weekend |
        |:--|--:|--:|
        | Kwartieren geleerd | {{ gw }}/96 | {{ gwe }}/96 |
        | Voortgang | {{ balk(gw) }} | {{ balk(gwe) }} |
        | Metingen totaal | {{ mw | sum }} | {{ mwe | sum }} |
        | Dagverbruik | {{ state_attr(v,'dagverbruik_werkdag_kwh') }} kWh | {{ state_attr(v,'dagverbruik_weekend_kwh') }} kWh |
        {%- if prof | count == 96 %}
        | Piek vandaag | {{ prof | max }} W om {{ kw(prof.index(prof | max)) }} | |
        | Laagst vandaag | {{ prof | min }} W om {{ kw(prof.index(prof | min)) }} | |
        {%- endif %}

        **Zonnecorrectie:** {{ states('sensor.zendure_ems_zonnecorrectie') ~ ' %' if states('sensor.zendure_ems_zonnecorrectie') | is_number else 'nog niet geleerd (vaste factor ' ~ states('input_number.zendure_ems_zon_factor') | int ~ ' %)' }}

        <sub>Kwartieren die nog niet geleerd zijn, gebruiken de vaste waarde van {{ states('input_number.zendure_ems_verwacht_verbruik') | int }} W (Instellingen → Verwacht verbruik). Met **Startprofiel uit historie opbouwen** (Instellingen) vul je het profiel in één keer uit de laatste 28 dagen.</sub>
      grid_options:
        columns: full
      type: markdown
      visibility:
      - condition: state
        entity: input_boolean.zendure_ems_toon_s_geleerd
        state: 'on'
