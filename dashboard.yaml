        name: Nog te laden tot vol
        suffix: kWh
        type: attribute
      - entity: sensor.zendure_ems_zonne_energie_vandaag
        name: Zonne-energie vandaag
      - entity: sensor.zendure_ems_ev_energie_vandaag
        name: Naar de auto vandaag
      - entity: sensor.zendure_ems_ev_kosten_vandaag
        name: Kosten auto vandaag
      - attribute: omschrijving
        entity: sensor.zendure_ems_prijsactie
        icon: mdi:flash-auto
        name: Prijsactie nu
        type: attribute
      - attribute: reden
        entity: sensor.zendure_ems_prijsactie
        icon: mdi:information-outline
        name: Reden
        type: attribute
      grid_options:
        columns: full
      title: Vandaag
      type: entities
      visibility:
      - condition: state
        entity: input_boolean.zendure_ems_toon_s_dagplanning
        state: 'on'
    type: grid
    column_span: 2
