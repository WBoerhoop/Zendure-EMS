- title: Instellingen
  path: instellingen
  icon: mdi:cog
  cards:
  - type: markdown
    content: |-
      **Eerst doen:** zet in de Zendure-app bij elke set **HEMS uit** en zet de **lokale API (HTTP)** aan. Vul hieronder de IP-adressen, de netmeter en de prijssensor in. Kies daarna op het Overzicht een modus. **Niet aansturen** = deze regeling doet niets. **Uit (stand-by)** = alle sets 0 W. **Alleen slim opladen / ontladen** = nul op de meter in één richting: alleen zonne-overschot laden, of alleen ontladen voor het eigen verbruik. Per set kan dat ook: kies op de setkaart bij **Eigen modus** *Alleen slim opladen* of *Alleen slim ontladen*; *Volgt EMS-modus* = zoals de modus. **Laden / Ontladen (vol vermogen)** = alle sets laden van of ontladen naar het net op hun maximale vermogen; als de accu vol of leeg is, gaat de modus terug naar de vorige modus. Tik op een onderdeel hieronder om het open of dicht te klappen.
      Dashboard **1.13.1** · package **{{ states('input_text.zendure_ems_versie') }}** {% if states('input_text.zendure_ems_versie') != '1.13.1' %}
      ⚠️ **Package en dashboard hebben niet dezelfde versie.** Plaats het package en het dashboard uit dezelfde zip en herstart Home Assistant. {% endif %}
