    - type: markdown
      content: Waarde van wat de accu leverde min wat het laden kostte, gewogen met de prijs van dat moment. Laden uit het net telt tegen de afnameprijs, laden met zonne-overschot tegen de terugleverprijs; leveren aan het huis tegen de afnameprijs, verkopen aan het net tegen de terugleverprijs. Tot en met 2026 (salderen) zijn die gelijk. Alle sets samen; de teller start bij installatie van 1.9.2.
